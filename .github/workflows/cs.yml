name: cs Proxy Check
on:
  # 手动运行
  workflow_dispatch:
  # 每30分钟运行
  schedule:
    - cron: "11 9,23 * * *"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # ======================================================
      # Checkout
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4
      # ======================================================
      # Python
      # ======================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ======================================================
      # Dependencies
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      # ======================================================
      # Run
      # ======================================================
      - name: Run proxy checker
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python proxy_check.py \
            --workers 16 \
            --output px.txt
      # ======================================================
      # 显示结果
      # ======================================================
      - name: Show result
        run: |
          echo "================================"
          echo "px.txt"
          echo "================================"
          if [ -f px.txt ]; then
            echo "有效代理数量："
            wc -l px.txt
            echo ""
            echo "TOP 20："
            head -20 px.txt
          else
            echo "px.txt 不存在"
          fi
      # ======================================================
      # Artifact
      # ======================================================
      - name: Upload px.txt
        uses: actions/upload-artifact@v4
        with:
          name: residential-proxy-list
          path: px.txt
          if-no-files-found: warn
      # ======================================================
      # Commit
      # ======================================================
      - name: Commit px.txt
        run: |
          git config user.name \
            "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add px.txt
          if git diff --cached --quiet; then
            echo "px.txt 没有变化"
          else
            git commit \
              -m "update residential proxy list"
            git push
          fi
