name: Fetch and Categorize IPs

on:
  workflow_dispatch: # 支持手动点击触发
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动运行一次（可根据需要修改）

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run IP fetcher script
      run: python fetch_ips.py

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 检查 ips 文件夹是否存在且里面有 txt 文件
        if [ -d "ips" ] && [ "$(ls -A ips/*.txt 2>/dev/null)" ]; then
          git add ips/*.txt
          # 只有在文件内容确实有变化时才提交
          git diff --staged --quiet || (git commit -m "Update IPs $(date +'%Y-%m-%d %H:%M:%S')" && git push)
        else
          echo "提示: 没有找到任何生成的 IP 文本文件，跳过提交。"
        fi
