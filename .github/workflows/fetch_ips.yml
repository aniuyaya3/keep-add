name: Fetch and Categorize IPs

on:
  workflow_dispatch: # 支持在 GitHub 页面上手动点击运行
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动后台运行一次

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run IP fetcher script
      run: python ips/fetch_ips.py

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 检查 ips 文件夹是否存在，且里面确实有 .txt 文件
        if [ -d "ips" ] && ls ips/*.txt 1> /dev/null 2>&1; then
          git add ips/*.txt
          # 只有在文件内容有实际变动时才提交，防止因无变动导致 git commit 报错
          git diff --staged --quiet || (git commit -m "Update IPs $(date +'%Y-%m-%d %H:%M:%S')" && git push)
        else
          echo "提示: 本次运行未检测到新生成的国家 IP 文本文件，跳过 Git 提交。"
        fi
