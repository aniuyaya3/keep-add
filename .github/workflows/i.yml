name: Generate Top5 IP Lists

on:
  schedule:
    - cron: "0 * * * *"   # 每小时运行一次（可改）
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run script
      run: |
        mkdir -p outputs
        python i.py

    - name: Upload outputs
      uses: actions/upload-artifact@v4
      with:
        name: top5-ip-files
        path: outputs/
