name: Generate Top5 IP Lists

on:
  schedule:
    - cron: "0 * * * *"   # 每小时运行一次
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run script
      run: python main.py

    - name: Upload outputs
      uses: actions/upload-artifact@v3
      with:
        name: top5-ip-files
        path: outputs/
