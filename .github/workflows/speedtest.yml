name: Run Python Filter

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run filter script
      run: python speedtest.py

    - name: Commit and Push
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        if git diff --exit-code ip.txt > /dev/null; then
          echo "No changes detected."
        else
          git add ip.txt
          git commit -m "自动更新: Python 筛选 HK IP"
          git push
        fi
