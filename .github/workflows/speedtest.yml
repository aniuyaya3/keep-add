name: EdgeTunnel IP Speed Test

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  test-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # 删除了错误的 python-cache-dependency-path

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run Speed Test Script
      run: |
        python speedtest.py

    - name: Commit and Push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 如果文件不存在则建一个空文件，防止 git add 崩溃
        touch ip.txt
        
        git add ip.txt
        # 只有在 ip.txt 真正发生内容变化时才提交，防止空提交报错
        git diff --quiet --staged || (git commit -m "Update fastest IPs $(date +'%Y-%m-%d %H:%M:%S')" && git push)
