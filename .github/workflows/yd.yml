name: CF IP Test

on:
  schedule:
    - cron: "0 */6 * * *"   # 每6小时跑一次
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install deps
        run: |
          pip install requests websockets

      - name: Run script
        run: python yd.py

      - name: Commit result
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@example.com"
          git add best_ips.txt
          git commit -m "update best ips" || echo "no change"
          git push
